name: Verify platform
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: nazmarket_test
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -ptest-password" --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm run test:integration
        working-directory: backend
        env:
          RUN_MYSQL_TESTS: "1"
          MYSQL_HOST: 127.0.0.1
          MYSQL_DATABASE: nazmarket_test
          MYSQL_USER: root
          MYSQL_PASSWORD: test-password
      - run: npm audit --omit=dev
        working-directory: backend
  interfaces:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, seller-frontend, courier-frontend, admin-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "${{ matrix.app }}/package-lock.json"
      - run: npm ci
        working-directory: "${{ matrix.app }}"
      - run: npm run typecheck
        working-directory: "${{ matrix.app }}"
      - run: npm run build
        working-directory: "${{ matrix.app }}"
      - run: npm audit
        working-directory: "${{ matrix.app }}"
  windows-backend:
    runs-on: windows-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ matrix.node }}"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
