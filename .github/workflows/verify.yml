name: Verify platform
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-password
          MYSQL_DATABASE: nazmarket_test
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -ptest-password" --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
      - name: Test MySQL workflow
        run: |
          if npm run test:integration > integration-output.log 2>&1; then
            cat integration-output.log
          else
            cat integration-output.log
            node --input-type=module -e "import fs from 'node:fs'; const text=fs.readFileSync('integration-output.log','utf8').slice(-50000); console.log('::error::'+text.replaceAll('%','%25').replaceAll('\r','%0D').replaceAll('\n','%0A'));"
            exit 1
          fi
        working-directory: backend
        env:
          RUN_MYSQL_TESTS: "1"
          MYSQL_HOST: 127.0.0.1
          MYSQL_DATABASE: nazmarket_test
          MYSQL_USER: root
          MYSQL_PASSWORD: test-password
      - run: npm audit --omit=dev
        working-directory: backend
  interfaces:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [frontend, seller-frontend, courier-frontend, admin-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: "${{ matrix.app }}/package-lock.json"
      - run: npm ci
        working-directory: "${{ matrix.app }}"
      - run: npm run typecheck
        working-directory: "${{ matrix.app }}"
      - run: npm run test --if-present
        working-directory: "${{ matrix.app }}"
      - run: npm run build
        working-directory: "${{ matrix.app }}"
      - run: npm audit
        working-directory: "${{ matrix.app }}"
  windows-backend:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "${{ matrix.node }}"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - name: Test Windows backend
        working-directory: backend
        shell: pwsh
        run: |
          npm test 2>&1 | Tee-Object -Variable testOutput
          if ($LASTEXITCODE -ne 0) {
            $details = ($testOutput -join "`n").Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error::$details"
            exit 1
          }
